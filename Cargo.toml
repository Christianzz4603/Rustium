[workspace]
resolver = "2"
members = [
    "crates/rustium-common",
    "crates/rustium-dom",
    "crates/rustium-html",
    "crates/rustium-core",
    "benchmarks/parse-bench",
    "crates/rustium-css",
    "tools/html5lib-runner",
    "tools/tokenizer-runner",
    "tools/css-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
rust-version = "1.82"
repository = "https://github.com/Christianzz4603/Rustium"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
